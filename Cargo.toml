[package]
name = "huijibot"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
pathdiff = "0.2.3"
reqwest = { version = "0.13.4", features = ["cookies", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
walkdir = "2.5.0"
